services:
  - type: web
    name: simusolv-website
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18
      # Optional — only needed if you want the contact form to send real email.
      # Add these in the Render dashboard instead of committing secrets here:
      # SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, CONTACT_TO
